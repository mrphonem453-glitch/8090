<!DOCTYPE html>
<html>
<head>
<title>African Buffalo Lobby</title>

<style>
body{
 margin:0;
 background:#140020;
 color:white;
 font-family:Arial;
 text-align:center;
}

.header{
 background:#700000;
 padding:20px;
 color:#ffd900;
 font-size:30px;
 font-weight:bold;
}

.box{
 margin:15px;
 padding:20px;
 background:#300050;
 border:3px solid gold;
 border-radius:15px;
}

button{
 background:#ffd900;
 border:0;
 padding:12px 20px;
 margin:5px;
 border-radius:10px;
 font-weight:bold;
}

.chair{
 background:#6500a8;
 color:white;
 border:2px solid gold;
}

.hide{
 display:none;
}

.card{
 width:90%;
 margin:20px auto;
 border:5px solid purple;
 border-radius:20px;
 overflow:hidden;
}

.card img{
 width:100%;
}
</style>

</head>

<body>


<div class="header">
🐃 AFRICAN BUFFALO
</div>


<!-- MAIN LOBBY -->

<div id="lobby">

<div class="card">
<img src="buffalo.jpg">
</div>

<button onclick="showRooms()">
ENTER LOBBY
</button>

</div>



<!-- ROOM LIST -->

<div id="rooms" class="hide">

<h2>ROOM LIST</h2>

<div id="roomBox"></div>

</div>



<!-- CHAIRS -->

<div id="chairs" class="hide">

<h2 id="roomTitle"></h2>

<div id="chairBox"></div>


<h3>PAGE</h3>

<button onclick="page(1)">1/4</button>
<button onclick="page(2)">2/4</button>
<button onclick="page(3)">3/4</button>
<button onclick="page(4)">4/4</button>


<br>

<button onclick="backRoom()">BACK</button>

</div>



<script>


let roomBox=document.getElementById("roomBox");


for(let i=1;i<=10;i++){

roomBox.innerHTML +=

`
<div class="box">

ROOM ${i}

<br>

<button onclick="openRoom(${i})">
ENTER
</button>

</div>
`;

}



function showRooms(){

document.getElementById("lobby").style.display="none";

document.getElementById("rooms").style.display="block";

}



function openRoom(r){

document.getElementById("rooms").style.display="none";

document.getElementById("chairs").style.display="block";


document.getElementById("roomTitle").innerHTML=
"ROOM "+r;


showChairs();

}



function showChairs(){

let c=document.getElementById("chairBox");

c.innerHTML="";


for(let i=1;i<=4;i++){

c.innerHTML +=

`
<div class="box">

🪑 CHAIR ${i}

<br>

<button>
SIT
</button>

</div>
`;

}

}



function page(n){

alert("Page "+n+" / 4");

}



function backRoom(){

document.getElementById("chairs").style.display="none";

document.getElementById("rooms").style.display="block";

}


</script>


</body>
</html>
