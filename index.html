<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>African Buffalo Lobby</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#100018;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

.header{
    background:#700000;
    color:#ffd900;
    padding:18px 10px;
    font-size:25px;
    font-weight:bold;
    border-bottom:3px solid #ffd900;
}

.title{
    padding:18px 10px;
    font-size:22px;
    font-weight:bold;
}

button{
    border:0;
    background:#ffd900;
    color:#260000;
    font-weight:bold;
    border-radius:8px;
    padding:12px 20px;
    cursor:pointer;
}

button:active{
    transform:scale(.96);
}

/* LOBBY */

#lobby{
    display:block;
}

.room{
    margin:10px;
    padding:18px;
    border:3px solid #ffd900;
    border-radius:14px;
    background:#300050;
}

.room-name{
    font-size:18px;
    color:#fff;
    margin-bottom:10px;
}

/* ROOM */

#roomPage{
    display:none;
}

.room-title{
    background:#21002f;
    color:white;
    padding:15px;
    font-size:22px;
    font-weight:bold;
}

.chair{
    margin:12px 6px;
    min-height:145px;
    padding:10px;
    border:3px solid #ffd900;
    border-radius:14px;
    background:#300050;
    position:relative;
    overflow:hidden;
}

.chair-number{
    font-weight:bold;
    color:#ffd900;
    font-size:16px;
    margin-bottom:5px;
}

/* EMPTY */

.empty-chair{
    padding:12px;
}

.empty-icon{
    font-size:35px;
    margin:5px;
}

.status{
    font-size:13px;
    color:#aaa;
    margin:5px;
}

/* OCCUPIED */

.occupied{
    min-height:220px;
}

.girl{
    width:110px;
    height:145px;
    object-fit:cover;
    border-radius:12px;
    border:3px solid #ffd900;
    display:block;
    margin:5px auto;
}

.player{
    color:#7cff00;
    font-weight:bold;
    font-size:13px;
}

.leave{
    background:#ff3b30;
    color:white;
    margin-top:5px;
    padding:8px 15px;
}

/* PAGE */

.pages{
    margin:20px 5px;
}

.page-title{
    color:#ffd900;
    font-weight:bold;
    margin-bottom:10px;
}

.page-btn{
    padding:9px 13px;
    margin:3px;
}

.back{
    margin-top:12px;
    background:#ffd900;
}
</style>
</head>

<body>

<div class="header">
    🐃 AFRICAN BUFFALO
</div>


<!-- LOBBY -->

<div id="lobby">

    <div class="title">
        ROOM LOBBY
    </div>

    <div id="roomList"></div>

</div>


<!-- ROOM -->

<div id="roomPage">

    <div class="room-title">
        🐃 AFRICAN BUFFALO
        <br>
        <span id="roomTitle">ROOM 1</span>
    </div>

    <div id="chairList"></div>

    <div class="pages">

        <div class="page-title">
            PAGE
        </div>

        <button class="page-btn" onclick="changePage(1)">
            1/4
        </button>

        <button class="page-btn" onclick="changePage(2)">
            2/4
        </button>

        <button class="page-btn" onclick="changePage(3)">
            3/4
        </button>

        <button class="page-btn" onclick="changePage(4)">
            4/4
        </button>

        <br>

        <button class="back" onclick="backLobby()">
            BACK
        </button>

    </div>

</div>


<script>

const ROOM_COUNT = 10;

const CHAIRS_PER_PAGE = 4;

let currentRoom = 1;

let currentPage = 1;


/* SAVE / LOAD */

let players = JSON.parse(
    localStorage.getItem("buffaloPlayers") || "{}"
);


function savePlayers(){

    localStorage.setItem(
        "buffaloPlayers",
        JSON.stringify(players)
    );

}


/* LOBBY */

function createLobby(){

    const list =
        document.getElementById("roomList");

    list.innerHTML = "";

    for(let i=1;i<=ROOM_COUNT;i++){

        const box =
            document.createElement("div");

        box.className = "room";

        box.innerHTML = `
            <div class="room-name">
                ROOM ${i}
            </div>

            <button onclick="openRoom(${i})">
                ENTER
            </button>
        `;

        list.appendChild(box);
    }
}


/* OPEN ROOM */

function openRoom(room){

    currentRoom = room;

    currentPage = 1;

    document.getElementById("lobby")
        .style.display = "none";

    document.getElementById("roomPage")
        .style.display = "block";

    document.getElementById("roomTitle")
        .textContent = "ROOM " + room;

    showChairs();
}


/* SHOW CHAIRS */

function showChairs(){

    const list =
        document.getElementById("chairList");

    list.innerHTML = "";

    const start =
        (currentPage - 1) * CHAIRS_PER_PAGE + 1;

    for(
        let i=start;
        i<start + CHAIRS_PER_PAGE;
        i++
    ){

        createChair(list,i);
    }
}


/* CREATE CHAIR */

function createChair(list,chairNumber){

    const key =
        "room" +
        currentRoom +
        "_chair" +
        chairNumber;

    const data =
        players[key];

    const box =
        document.createElement("div");

    box.className = "chair";


    /* EMPTY */

    if(!data){

        box.innerHTML = `

            <div class="chair-number">
                🪑 CHAIR ${chairNumber}
            </div>

            <div class="empty-chair">

                <div class="empty-icon">
                    🪑
                </div>

                <div class="status">
                    EMPTY
                </div>

                <button onclick="sitChair(${chairNumber})">
                    SIT
                </button>

            </div>

        `;

    }


    /* OCCUPIED */

    else{

        box.classList.add("occupied");

        const girlNumber =
            ((chairNumber - 1) % 4) + 1;

        box.innerHTML = `

            <div class="chair-number">
                🪑 CHAIR ${chairNumber}
            </div>

            <img
                class="girl"
                src="girl${girlNumber}.png"
                alt="3D Player"
            >

            <div class="player">
                👤 PLAYER
            </div>

            <div class="status">
                OCCUPIED
            </div>

            <button
                class="leave"
                onclick="leaveChair(${chairNumber})"
            >
                LEAVE
            </button>

        `;
    }

    list.appendChild(box);
}


/* SIT
   NO NAME INPUT
*/

function sitChair(chairNumber){

    const key =
        "room" +
        currentRoom +
        "_chair" +
        chairNumber;


    if(players[key]){

        return;
    }


    players[key] = {

        player:true,

        time:Date.now()

    };


    savePlayers();

    showChairs();
}


/* LEAVE */

function leaveChair(chairNumber){

    const key =
        "room" +
        currentRoom +
        "_chair" +
        chairNumber;


    delete players[key];

    savePlayers();

    showChairs();
}


/* PAGE */

function changePage(page){

    currentPage = page;

    showChairs();
}


/* BACK */

function backLobby(){

    document.getElementById("roomPage")
        .style.display = "none";

    document.getElementById("lobby")
        .style.display = "block";
}


/* START */

createLobby();

</script>

</body>
</html>
