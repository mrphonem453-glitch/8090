<!DOCTYPE html>
<html>
<head>
<title>African Buffalo Lobby</title>

<style>
body{
margin:0;
background:#12001f;
color:white;
font-family:Arial;
text-align:center;
}

.header{
background:#800000;
padding:18px;
font-size:28px;
font-weight:bold;
color:#ffd700;
}

.card{
margin:12px;
padding:20px;
background:#350050;
border:3px solid gold;
border-radius:15px;
}

button{
background:#ffd700;
border:0;
padding:10px 25px;
border-radius:10px;
font-weight:bold;
}

.hidden{
display:none;
}

.room{
margin:10px;
padding:25px;
background:#400060;
border:2px solid gold;
border-radius:15px;
}

.seat{
display:inline-block;
width:130px;
height:100px;
margin:8px;
padding-top:20px;
background:#250035;
border:3px solid gold;
border-radius:15px;
}

.empty{
color:#aaa;
}

.full{
color:#00ff00;
}

</style>
</head>

<body>

<div class="header">
🐃 AFRICAN BUFFALO
</div>


<div id="lobby">

<h3>ROOM LIST</h3>

<div class="room">
ROOM 1<br>
<button onclick="openRoom(1)">ENTER</button>
</div>

<div class="room">
ROOM 2<br>
<button onclick="openRoom(2)">ENTER</button>
</div>

<div class="room">
ROOM 3<br>
<button onclick="openRoom(3)">ENTER</button>
</div>

<div class="room">
ROOM 4<br>
<button onclick="openRoom(4)">ENTER</button>
</div>

<div class="room">
ROOM 5<br>
<button onclick="openRoom(5)">ENTER</button>
</div>

<div class="room">
ROOM 6<br>
<button onclick="openRoom(6)">ENTER</button>
</div>

<div class="room">
ROOM 7<br>
<button onclick="openRoom(7)">ENTER</button>
</div>

<div class="room">
ROOM 8<br>
<button onclick="openRoom(8)">ENTER</button>
</div>

<div class="room">
ROOM 9<br>
<button onclick="openRoom(9)">ENTER</button>
</div>

<div class="room">
ROOM 10<br>
<button onclick="openRoom(10)">ENTER</button>
</div>

</div>


<div id="roomPage" class="hidden">

<h3 id="roomTitle"></h3>

<div id="chairs"></div>

<div>
PAGE
<br><br>
<button>1/4</button>
<button>2/4</button>
<button>3/4</button>
<button>4/4</button>
</div>

<br>

<button onclick="back()">BACK</button>

</div><div id="roomPage" class="hidden">

<h3 id="roomTitle"></h3>

<div id="chairs"></div>

<br>

<button onclick="back()">BACK</button>

</div>


<script>

let seats = [
false,
false,
false,
false
];


function openRoom(number){

document.getElementById("lobby").classList.add("hidden");

document.getElementById("roomPage").classList.remove("hidden");

document.getElementById("roomTitle").innerHTML =
"ROOM "+number;


showChairs();

}



function showChairs(){

let box=document.getElementById("chairs");

box.innerHTML="";


for(let i=0;i<4;i++){

let status = seats[i]
? '<img src="images/girl3d.png" width="80"><br>PLAYER'
: "🪑 EMPTY";


box.innerHTML +=

`
<div class="seat" onclick="sit(${i})">

${status}

<br><br>

<button>
SIT
</button>

</div>
`;

}

}



function sit(id){

seats[id]=true;

showChairs();

}



function back(){

document.getElementById("roomPage").classList.add("hidden");

document.getElementById("lobby").classList.remove("hidden");

}


</script>


</body>
</html>
