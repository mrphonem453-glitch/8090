<!DOCTYPE html>
<html>
<head>
<title>African Buffalo Lobby</title>

<style>
body{
 margin:0;
 background:#12001f;
 color:white;
 font-family:Arial;
 text-align:center;
}

.header{
 background:#800000;
 padding:20px;
 color:#ffd700;
 font-size:28px;
 font-weight:bold;
}

.box{
 margin:15px;
 padding:20px;
 background:#300050;
 border:3px solid gold;
 border-radius:15px;
}

button{
 background:#ffd700;
 border:none;
 padding:10px 25px;
 border-radius:10px;
 font-weight:bold;
}

.room{
 margin:10px;
 padding:25px;
 border:2px solid gold;
 border-radius:15px;
 background:#400060;
}

.seat{
 display:inline-block;
 width:120px;
 height:120px;
 margin:10px;
 background:#250035;
 border:3px solid gold;
 border-radius:15px;
 padding-top:20px;
}

.online{
 color:#00ff00;
}

.empty{
 color:#aaa;
}

.hidden{
 display:none;
}

</style>
</head>

<body>

<div class="header">
🐃 AFRICAN BUFFALO
</div>

<div id="lobby">
<h3>ROOM LIST</h3>

<div class="room">
ROOM 1<br>
<button onclick="openRoom()">ENTER</button>
</div>

<div class="room">
ROOM 2<br>
<button onclick="openRoom()">ENTER</button>
</div>

<div class="room">
ROOM 3<br>
<button onclick="openRoom()">ENTER</button>
</div>

<div class="room">
ROOM 4<br>
<button onclick="openRoom()">ENTER</button>
</div>

</div><div id="room" class="hidden">

<h3>ROOM 1 - CHAIRS</h3>

<div class="seat" onclick="sit(0)">
🪑<br>
<span id="s0" class="empty">EMPTY</span>
</div>

<div class="seat" onclick="sit(1)">
🪑<br>
<span id="s1" class="empty">EMPTY</span>
</div>

<div class="seat" onclick="sit(2)">
🪑<br>
<span id="s2" class="empty">EMPTY</span>
</div>

<div class="seat" onclick="sit(3)">
🪑<br>
<span id="s3" class="empty">EMPTY</span>
</div>

<br><br>

<button onclick="backLobby()">BACK</button>

</div>


<script>

let seats=[
false,
false,
false,
false
];


function openRoom(){

document.getElementById("lobby").classList.add("hidden");

document.getElementById("room").classList.remove("hidden");

}



function sit(id){

if(seats[id]==false){

seats[id]=true;

document.getElementById("s"+id).innerHTML="👤 PLAYER";

document.getElementById("s"+id).className="online";

}

else{

alert("ဒီခုံမှာ လူရှိပြီးသား");

}

}



function backLobby(){

document.getElementById("room").classList.add("hidden");

document.getElementById("lobby").classList.remove("hidden");

}

</script>


</body>
</html>
