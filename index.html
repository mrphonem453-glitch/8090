<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8090 Buffalo</title>
<style>
body{
  margin:0;
  background:#12001f;
  color:white;
  font-family:sans-serif;
  text-align:center;
}
.header{
  background:#5b0000;
  padding:20px;
  font-size:28px;
  color:#ffd700;
}
.room{
  margin:20px;
  padding:20px;
  background:#260044;
  border-radius:15px;
}
button{
  background:#ffcc00;
  border:0;
  padding:15px 30px;
  border-radius:10px;
  font-size:20px;
}
.chairs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:20px;
}
.chair{
  background:#7b2cff;
  padding:20px 5px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="header">
8090 BUFFALO
</div>

<div class="room">
<h2>Room 1</h2>
<p>Section 1</p>

<div class="chairs">
<div class="chair">Chair 1</div>
<div class="chair">Chair 2</div>
<div class="chair">Chair 3</div>
<div class="chair">Chair 4</div>
</div>

<br>
<button>PLAY</button>

</div>

</body>
</html>
