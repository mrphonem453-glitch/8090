<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>African Buffalo Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100018;color:#fff;font-family:Arial;text-align:center}.header{background:#700000;color:#ffd900;padding:17px;font-size:24px;font-weight:bold}.nav{padding:10px}button{border:0;border-radius:8px;background:#ffd900;color:#240000;font-weight:bold;padding:10px 16px;margin:3px}.room{margin:10px;padding:17px;border:3px solid #ffd900;border-radius:14px;background:#300050}.count{color:#9cff00;font-size:13px;margin:7px}.hidden{display:none!important}#roomPage{display:none}.title{padding:16px;font-size:21px;font-weight:bold}.chair{margin:11px 6px;padding:10px;min-height:150px;border:3px solid #ffd900;border-radius:14px;background:#300050}.occupied{min-height:215px}.num{color:#ffd900;font-weight:bold}.girl{width:110px;height:140px;object-fit:cover;border-radius:12px;border:3px solid #ffd900;display:block;margin:5px auto}.status{font-size:13px;color:#aaa;margin:5px}.player{color:#7cff00;font-weight:bold}.leave{background:#ff3b30;color:#fff}.pages{margin:18px}.card,.app{margin:12px;padding:20px;border:3px solid #ffd900;border-radius:15px;background:#300050}.price{font-size:22px;color:#7cff00;font-weight:bold}.note{color:#bbb;font-size:13px;line-height:1.5}
</style></head><body>
<div class="header">🐃 AFRICAN BUFFALO</div>
<div id="lobby"><div class="nav"><button onclick="showLobby()">🏠 Lobby</button><button onclick="showApps()">📱 Apps</button><button onclick="showPay()">💳 Premium</button></div>
<div id="lobbyPage"><div class="title">ROOM LOBBY</div><div id="rooms"></div></div>
<div id="apps" class="hidden"><div class="title">📱 APPS</div><div class="app">🎮<h3>Game</h3><p class="note">Demo app</p><button onclick="showLobby()">OPEN</button></div><div class="app">🧩<h3>More Apps</h3><p class="note">New apps can be added later.</p></div><button onclick="showLobby()">BACK</button></div>
<div id="pay" class="hidden"><div class="title">💳 PREMIUM</div><div class="card"><h3>Premium Demo</h3><div class="price">COMING SOON</div><p class="note">No real payment yet. A secure payment provider can be connected later.</p><button onclick="alert('Demo only — no real charge.')">BUY DEMO</button></div><button onclick="showLobby()">BACK</button></div></div>
<div id="roomPage"><div class="title">🐃 AFRICAN BUFFALO<br><span id="roomTitle"></span></div><div id="chairs"></div><div class="pages">PAGE<div id="pageButtons"></div><br><button onclick="back()">BACK</button></div></div>
<script>
const R=10,C=4,PAGES=30;let room=1,p=1;let players=JSON.parse(localStorage.getItem("buffaloPlayers")||"{}");
const save=()=>localStorage.setItem("buffaloPlayers",JSON.stringify(players));
function count(r){let n=0;for(let i=1;i<=120;i++)if(players["r"+r+"c"+i])n++;return n}
function lobby(){let x=document.getElementById("rooms");x.innerHTML="";for(let i=1;i<=R;i++)x.innerHTML+=`<div class="room"><b>ROOM ${i}</b><div class="count">👥 ${count(i)}/16 PLAYERS</div><button onclick="openRoom(${i})">ENTER</button></div>`}
function hide(){document.getElementById("lobbyPage").classList.add("hidden");document.getElementById("apps").classList.add("hidden");document.getElementById("pay").classList.add("hidden")}
function showLobby(){hide();document.getElementById("lobbyPage").classList.remove("hidden");document.getElementById("roomPage").style.display="none";lobby()}
function showApps(){hide();document.getElementById("apps").classList.remove("hidden");document.getElementById("roomPage").style.display="none"}
function showPay(){hide();document.getElementById("pay").classList.remove("hidden");document.getElementById("roomPage").style.display="none"}
function openRoom(r){room=r;p=1;document.getElementById("lobby").style.display="none";document.getElementById("roomPage").style.display="block";document.getElementById("roomTitle").textContent="ROOM "+r;draw()}
function draw(){let x=document.getElementById("chairs");x.innerHTML="";let s=(p-1)*C+1;for(let i=s;i<s+C;i++){let k="r"+room+"c"+i,d=players[k],g=((i-1)%4)+1;x.innerHTML+=d?`<div class="chair occupied"><div class="num">🪑 CHAIR ${i}</div><img class="girl" src="girl${g}.png"><div class="player">👤 PLAYER</div><div class="status">OCCUPIED</div><button class="leave" onclick="leave(${i})">LEAVE</button></div>`:`<div class="chair"><div class="num">🪑 CHAIR ${i}</div><div>🪑</div><div class="status">EMPTY</div><button onclick="sit(${i})">SIT</button></div>`}}
function sit(i){let k="r"+room+"c"+i;if(!players[k])players[k]={time:Date.now()};save();draw()}
function leave(i){delete players["r"+room+"c"+i];save();draw()}
function makePages(){
  const box=document.getElementById("pageButtons");
  box.innerHTML="";
  for(let i=1;i<=PAGES;i++){
    const b=document.createElement("button");
    b.textContent=i+"/30";
    b.onclick=()=>page(i);
    box.appendChild(b);
  }
}
function page(n){p=n;draw()}
function back(){document.getElementById("roomPage").style.display="none";document.getElementById("lobby").style.display="block";showLobby()}makePages();lobby();
</script></body></html>
